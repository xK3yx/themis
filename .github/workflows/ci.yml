name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the dev host; Linux catches path-separator and permission assumptions.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --locked

      - name: SQLite version
        run: uv run python -c "import sqlite3, sys; print(sys.version); print('sqlite', sqlite3.sqlite_version)"

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
